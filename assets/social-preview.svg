<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="Brazilian Computer Guy — canivete suíço de TI para agentes de IA">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="55%" stop-color="#101a2e"/>
      <stop offset="100%" stop-color="#0a1a17"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="50%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)" opacity="0.55"/>
  <rect x="0" y="0" width="1280" height="6" fill="url(#accent)"/>

  <!-- marca -->
  <g transform="translate(96,104)">
    <rect x="0" y="0" width="76" height="76" rx="16" fill="#0f172a" stroke="#22c55e" stroke-width="2"/>
    <path d="M22 52 L36 22 L50 52" fill="none" stroke="#22c55e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="58" cy="24" r="5" fill="#facc15"/>
    <text x="94" y="30" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="18" font-weight="600" letter-spacing="3.5" fill="#64748b">OPEN SOURCE</text>
    <text x="94" y="56" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="18" font-weight="600" letter-spacing="3.5" fill="#64748b">MIT LICENSE</text>
  </g>

  <!-- título -->
  <text x="96" y="296" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="72" font-weight="800" fill="#f8fafc">Brazilian</text>
  <text x="96" y="372" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="72" font-weight="800" fill="#22c55e">Computer Guy</text>

  <!-- subtítulo -->
  <text x="96" y="428" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="24" fill="#cbd5e1">O canivete suíço de TI para técnicos</text>
  <text x="96" y="462" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="24" fill="#cbd5e1">de informática em ambientes de IA.</text>

  <!-- pilares -->
  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="19" fill="#94a3b8">
    <g transform="translate(96,510)">
      <rect x="0" y="0" width="286" height="44" rx="22" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
      <circle cx="24" cy="22" r="6" fill="#22c55e"/>
      <text x="44" y="29">Diagnóstico somente leitura</text>
    </g>
    <g transform="translate(96,562)">
      <rect x="0" y="0" width="286" height="44" rx="22" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
      <circle cx="24" cy="22" r="6" fill="#facc15"/>
      <text x="44" y="29">Autorização explícita</text>
    </g>
    <g transform="translate(398,510)">
      <rect x="0" y="0" width="286" height="44" rx="22" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
      <circle cx="24" cy="22" r="6" fill="#3b82f6"/>
      <text x="44" y="29">Relatório obrigatório</text>
    </g>
    <g transform="translate(398,562)">
      <rect x="0" y="0" width="286" height="44" rx="22" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
      <circle cx="24" cy="22" r="6" fill="#22c55e"/>
      <text x="44" y="29">Windows, Debian e rede</text>
    </g>
  </g>

  <!-- painel direito: ciclo -->
  <g transform="translate(756,128)">
    <rect x="0" y="0" width="428" height="384" rx="18" fill="#0b1220" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="0" y="0" width="428" height="38" rx="18" fill="#111c30"/>
    <rect x="0" y="20" width="428" height="18" fill="#111c30"/>
    <circle cx="24" cy="19" r="5" fill="#ef4444"/>
    <circle cx="44" cy="19" r="5" fill="#facc15"/>
    <circle cx="64" cy="19" r="5" fill="#22c55e"/>
    <text x="88" y="25" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#64748b">ciclo-de-atendimento.bcg</text>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">
      <text x="26" y="82" fill="#475569">01</text><text x="66" y="82" fill="#e2e8f0">Diagnóstico read-only</text>
      <text x="26" y="130" fill="#475569">02</text><text x="66" y="130" fill="#e2e8f0">Proposta técnica</text>
      <text x="26" y="178" fill="#475569">03</text><text x="66" y="178" fill="#facc15">Autorização humana</text>
      <text x="26" y="226" fill="#475569">04</text><text x="66" y="226" fill="#e2e8f0">Execução aprovada</text>
      <text x="26" y="274" fill="#475569">05</text><text x="66" y="274" fill="#e2e8f0">Validação antes/depois</text>
      <text x="26" y="322" fill="#475569">06</text><text x="66" y="322" fill="#22c55e">Relatório técnico</text>
    </g>
    <line x1="26" y1="98" x2="402" y2="98" stroke="#1e293b" stroke-width="1"/>
    <line x1="26" y1="146" x2="402" y2="146" stroke="#1e293b" stroke-width="1"/>
    <line x1="26" y1="194" x2="402" y2="194" stroke="#1e293b" stroke-width="1"/>
    <line x1="26" y1="242" x2="402" y2="242" stroke="#1e293b" stroke-width="1"/>
    <line x1="26" y1="290" x2="402" y2="290" stroke="#1e293b" stroke-width="1"/>
  </g>
</svg>
